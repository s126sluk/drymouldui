// Links in plan emails and texts point here (short, stable). The plan itself
// is shown by /action-plan/?t=<token>.
(function () {
  var t = window.dsMap ? window.dsMap.token('t') : '';
  if (t) {
    var q = new URLSearchParams(window.location.search);
    q.set('t', t);
    window.location.replace('/action-plan/?' + q.toString());
    return;
  }
  document.getElementById('h').textContent = "We couldn't find that plan.";
  document.getElementById('p').hidden = false;
  document.getElementById('go').hidden = false;
})();
