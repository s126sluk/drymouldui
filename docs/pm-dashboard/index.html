<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#061630" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Field CRM" />
<meta name="format-detection" content="telephone=no" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src https://drysafeapi.vercel.app; base-uri 'none'; form-action 'none'; object-src 'none'" />
<title>Field CRM | DrySafe</title>
<link rel="icon" href="/img/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* Liquid Glass. Colours: lead #A9DAFF, warm #FFD592, partner #A6F2C0, alert #FFB3B3; series Basic #3987e5, Care #d95926, Assessment #199e70. */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; color: #FFFFFF; background: #061630;
  font-family: 'Plus Jakarta Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background-color: #061630;
  background-image:
    radial-gradient(60% 42% at 96% 4%, rgba(44,107,255,0.95) 0%, rgba(44,107,255,0) 100%),
    radial-gradient(58% 40% at 0% 62%, rgba(17,179,164,0.7) 0%, rgba(17,179,164,0) 100%),
    radial-gradient(75% 45% at 78% 100%, rgba(106,60,240,0.85) 0%, rgba(106,60,240,0) 100%);
}
body.locked { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid #7CC4FF; outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
ol, ul { list-style: none; margin: 0; padding: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* layout */
.wrap { max-width: 480px; margin: 0 auto; }
.screen { padding: calc(18px + env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
.screen.tight { padding-top: calc(10px + env(safe-area-inset-top)); gap: 12px; }
.screen.rev { padding-top: 0; }
.k { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #A9BBD6; text-transform: uppercase; }
.h1 { margin-top: 2px; font-size: 32px; line-height: 38px; font-weight: 800; letter-spacing: -0.02em; }
.h1.sm { font-size: 28px; line-height: 34px; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.sechead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sechead h2, .h2 { font-size: 18px; font-weight: 800; }
.h3 { font-size: 16px; font-weight: 800; }
.h4 { font-size: 15px; font-weight: 800; }
.muted { color: #C9D6EA; }
.dim { color: #A9BBD6; }
.small { font-size: 12px; line-height: 17px; }
.xs { font-size: 11px; line-height: 15px; }
.foot { font-size: 12px; line-height: 17px; color: #C9D6EA; }
.warnfg { color: #FFD592; }
.alertfg { color: #FFB3B3; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.row-sb { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 8px; }

/* glass */
.glass {
  border-radius: 22px; padding: 14px; background: rgba(9,22,46,0.5);
  border: 1px solid rgba(255,255,255,0.16); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22);
}
.glass.deep { background: rgba(9,22,46,0.72); }
.glass.lift { box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 14px 34px rgba(0,0,0,0.24); }
.blur { -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%); }
.glass.list { padding: 6px 14px; }
.hero {
  border-radius: 26px; padding: 16px; border: 1px solid rgba(255,255,255,0.24);
  background: linear-gradient(150deg, rgba(57,135,229,0.45) 0%, rgba(9,22,46,0.62) 64%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 18px 40px rgba(0,0,0,0.32);
}
.amber { border-radius: 22px; padding: 14px; background: rgba(255,196,107,0.14); border: 1px solid rgba(255,213,146,0.5); display: flex; flex-direction: column; gap: 6px; }
.amber h2 { color: #FFE2B0; }
.amber p { color: #F5E6CC; }
.panel-alert { border-radius: 22px; padding: 14px; background: rgba(255,110,110,0.16); border: 1px solid rgba(255,179,179,0.55); }
.panel-alert h2 { color: #FFD3D3; }
.panel-warn { border-radius: 22px; padding: 14px; background: rgba(255,196,107,0.15); border: 1px solid rgba(255,213,146,0.55); }
.panel-warn h2 { color: #FFE2B0; }
.panel-info { border-radius: 22px; padding: 14px; background: rgba(124,196,255,0.14); border: 1px solid rgba(169,218,255,0.45); }
.panel-info h2 { color: #D5ECFF; }
.panel-alert p, .panel-warn p, .panel-info p { margin-top: 4px; font-size: 13px; line-height: 18px; color: #EAF1FA; }

/* controls */
.seg { display: grid; padding: 4px; border-radius: 16px; background: rgba(9,22,46,0.5); border: 1px solid rgba(255,255,255,0.16); }
.seg.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.seg.five { grid-template-columns: repeat(5, minmax(0, 1fr)); background: rgba(9,22,46,0.6); }
.seg button { height: 44px; border-radius: 12px; color: #DDE7F5; font-size: 14px; font-weight: 600; text-align: center; }
.seg.five button { font-size: 12px; }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: rgba(255,255,255,0.92); color: #0A1F3F; font-weight: 800; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 14px; border-radius: 14px; font-size: 13px; font-weight: 700; text-decoration: none; text-align: center; }
.btn.primary { background: linear-gradient(135deg, #5AB4FF 0%, #2EE6C9 100%); color: #04203D; font-weight: 800; }
.btn.ghost { border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #FFFFFF; }
.btn.amberbtn { border: 1px solid rgba(255,213,146,0.55); background: rgba(255,196,107,0.16); color: #FFE2B0; font-size: 14px; font-weight: 800; }
.btn.big { height: 52px; border-radius: 18px; font-size: 15px; }
.btn.wide { width: 100%; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.45; pointer-events: none; }
.back { align-self: flex-start; display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 12px 0 6px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.18); background: rgba(9,22,46,0.5); font-size: 14px; font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 13px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip[aria-pressed="true"] { border: 0; background: rgba(255,255,255,0.92); color: #0A1F3F; font-weight: 800; }
.chip.soft[aria-pressed="true"] { border: 1px solid rgba(124,196,255,0.7); background: rgba(124,196,255,0.24); color: #FFFFFF; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.t-lead { background: rgba(124,196,255,0.2); color: #A9DAFF; }
.t-warm { background: rgba(255,196,107,0.2); color: #FFD592; }
.t-partner { background: rgba(126,232,161,0.2); color: #A6F2C0; }
.t-alert { background: rgba(255,110,110,0.22); color: #FFB3B3; }
.t-ink { background: rgba(255,255,255,0.14); color: #FFFFFF; }
.t-unset { background: rgba(255,255,255,0.12); color: #D9E3F1; }
.fg-lead { color: #A9DAFF; } .fg-warm { color: #FFD592; } .fg-partner { color: #A6F2C0; } .fg-alert { color: #FFB3B3; } .fg-ink { color: #FFFFFF; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 5px; flex-shrink: 0; }
.dot.lead { background: #A9DAFF; box-shadow: 0 0 10px #A9DAFF; } .dot.warm { background: #FFD592; box-shadow: 0 0 10px #FFD592; }
.dot.partner { background: #A6F2C0; box-shadow: 0 0 10px #A6F2C0; } .dot.alert { background: #FFB3B3; box-shadow: 0 0 10px #FFB3B3; }
.dot.ink { background: #FFFFFF; box-shadow: 0 0 10px #FFFFFF; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.sw.basic { background: #3987e5; } .sw.care { background: #d95926; } .sw.assessment { background: #199e70; } .sw.other { background: #8A9BB5; }

/* search */
.search { position: relative; }
.search svg { position: absolute; left: 16px; top: 16px; color: #C9D6EA; pointer-events: none; }
.search input { width: 100%; height: 52px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.2); background: rgba(9,22,46,0.5); color: #FFFFFF; padding: 0 16px 0 46px; font-size: 16px; -webkit-appearance: none; appearance: none; }
.search input::placeholder { color: #A9BBD6; }
.search.small input { height: 48px; border-radius: 16px; }
.search.small svg { top: 14px; }

/* nav */
nav.main {
  position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom));
  width: min(456px, calc(100% - 24px)); height: 72px; border-radius: 36px; padding: 0 6px;
  background: rgba(9,22,46,0.62); -webkit-backdrop-filter: blur(26px) saturate(180%); backdrop-filter: blur(26px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.2); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 16px 40px rgba(0,0,0,0.4);
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center;
}
nav.main button { min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 700; color: #B9C8DE; text-align: center; }
nav.main button[aria-current="page"] { color: #FFFFFF; text-shadow: 0 0 12px rgba(124,196,255,0.8); }
nav.main .orb { justify-self: center; width: 58px; height: 58px; min-height: 58px; border-radius: 29px; margin-top: -26px; color: #04203D; background: linear-gradient(140deg, #5AB4FF 0%, #2EE6C9 100%); box-shadow: 0 10px 26px rgba(46,230,201,0.5), inset 0 1px 0 rgba(255,255,255,0.7); }

/* overview */
.avatar { width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.3); font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.pipe .n { font-size: 26px; font-weight: 800; }
.flow { display: flex; gap: 3px; height: 6px; margin-top: 10px; }
.flow span { border-radius: 3px; min-width: 3px; }
.revbtn { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.22); background: linear-gradient(135deg, rgba(57,135,229,0.42) 0%, rgba(9,22,46,0.5) 72%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 12px 28px rgba(0,0,0,0.22); width: 100%; }
.orbicon { width: 42px; height: 42px; border-radius: 21px; flex-shrink: 0; background: linear-gradient(140deg, #5AB4FF 0%, #2EE6C9 100%); color: #04203D; box-shadow: 0 6px 16px rgba(46,230,201,0.4); display: flex; align-items: center; justify-content: center; }
.tile { display: flex; flex-direction: column; gap: 3px; min-height: 104px; border-radius: 20px; padding: 12px; background: rgba(9,22,46,0.5); border: 1px solid rgba(255,255,255,0.16); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22); width: 100%; }
.tile .n { font-size: 28px; line-height: 32px; font-weight: 800; }
.tile .l { font-size: 14px; line-height: 18px; font-weight: 700; }
.tile .s { font-size: 12px; line-height: 16px; color: #C9D6EA; }
.stat { border-radius: 18px; padding: 10px; background: rgba(9,22,46,0.5); border: 1px solid rgba(255,255,255,0.16); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .k2 { font-size: 11px; font-weight: 700; color: #C9D6EA; }
.stat .v { font-size: 24px; font-weight: 800; }
.stat .v.sm { font-size: 14px; line-height: 19px; font-weight: 700; overflow-wrap: anywhere; }

/* rows */
.row { width: 100%; min-height: 54px; display: flex; align-items: center; gap: 10px; padding: 8px 0; text-align: left; }
.rows > * + * { border-top: 1px solid rgba(255,255,255,0.1); }
.rows.amberrows > * + * { border-top-color: rgba(255,213,146,0.25); }
.row .grow { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.row .t { font-size: 14px; font-weight: 700; }
.row .s { font-size: 12px; line-height: 16px; color: #C9D6EA; }
.row .end { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; }
.letter { width: 30px; height: 30px; border-radius: 15px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; border: 1px solid currentColor; }
.cashdot { width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; }

/* board */
.card { display: flex; flex-direction: column; gap: 10px; width: 100%; text-align: left; }
.card h2 { font-size: 16px; line-height: 21px; font-weight: 700; }
.badge { flex-shrink: 0; align-self: flex-start; font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 999px; }
.cad { display: flex; gap: 12px; flex-wrap: wrap; }
.cad .r { display: flex; align-items: center; gap: 4px; }
.cad .rl { font-size: 11px; font-weight: 700; color: #C9D6EA; width: 16px; }
.step { width: 26px; height: 26px; border-radius: 9px; display: flex; align-items: center; justify-content: center; }
.step.done { background: linear-gradient(135deg, #5AB4FF, #2EE6C9); box-shadow: 0 0 12px rgba(46,230,201,0.45); color: #04203D; }
.step.tried { border: 1.5px dashed #FFD592; color: #FFD592; }
.step.todo { border: 1px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.6); }
.stagetabs button { height: 56px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.16); background: rgba(9,22,46,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.stagetabs button .n { font-size: 18px; font-weight: 800; }
.stagetabs button .l { font-size: 12px; color: #C9D6EA; }
.stagetabs button[aria-selected="true"].lead { border-color: rgba(169,218,255,0.7); background: rgba(124,196,255,0.22); box-shadow: 0 0 22px rgba(124,196,255,0.35); }
.stagetabs button[aria-selected="true"].warm { border-color: rgba(255,213,146,0.7); background: rgba(255,196,107,0.22); box-shadow: 0 0 22px rgba(255,196,107,0.35); }
.stagetabs button[aria-selected="true"].partner { border-color: rgba(166,242,192,0.7); background: rgba(126,232,161,0.2); box-shadow: 0 0 22px rgba(126,232,161,0.3); }
.stagetabs button[aria-selected="true"] .l { color: #FFFFFF; font-weight: 700; }
.filter4 button { height: 44px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(9,22,46,0.5); font-size: 13px; font-weight: 700; text-align: center; }
.filter4 button[aria-pressed="true"] { border: 0; background: rgba(255,255,255,0.92); color: #0A1F3F; font-weight: 800; }

/* offices */
.group { padding: 0; overflow: hidden; }
.ghead { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 14px; background: rgba(255,255,255,0.08); }
.ghead h2 { font-size: 13px; font-weight: 800; }
.grev { width: 100%; min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-top: 1px solid rgba(255,255,255,0.1); background: rgba(57,135,229,0.18); font-size: 12px; font-weight: 700; text-align: left; }
.group .rows { padding: 0 14px; }
.group .rows > :first-child { border-top: 1px solid rgba(255,255,255,0.1); }

/* contact */
.ring { width: 64px; height: 64px; border-radius: 32px; padding: 3px; flex-shrink: 0; background: linear-gradient(135deg, #FFC46B, #FF8FB1, #7CC4FF); }
.ring > div { width: 58px; height: 58px; border-radius: 29px; background: #0E2445; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; }
.act { min-height: 60px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; text-align: center; }
.act.primary { border: 0; background: linear-gradient(135deg, #5AB4FF 0%, #2EE6C9 100%); color: #04203D; font-weight: 800; }
.act[aria-disabled="true"] { opacity: 0.4; pointer-events: none; }
.glance { border-radius: 18px; padding: 10px 12px; background: rgba(9,22,46,0.5); border: 1px solid rgba(255,255,255,0.16); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.glance .k2 { font-size: 11px; font-weight: 700; color: #C9D6EA; }
.glance .v { font-size: 14px; line-height: 19px; font-weight: 700; overflow-wrap: anywhere; }
.glance .s { font-size: 11px; color: #C9D6EA; }
.cadrow { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
.cadrow .pill { text-align: center; }
.tl li { display: flex; gap: 10px; padding: 9px 0; }
.tl li + li { border-top: 1px solid rgba(255,255,255,0.1); }
.tl .dot { margin-top: 5px; }
.tl .w { font-size: 12px; font-weight: 700; color: #C9D6EA; }
.tl .x { margin-top: 2px; font-size: 13px; line-height: 18px; overflow-wrap: anywhere; }
.tl .nx { margin-top: 3px; font-size: 12px; line-height: 17px; color: #A9DAFF; }
.mini { border-radius: 14px; padding: 8px 10px; background: rgba(255,255,255,0.07); min-width: 0; }
.mini .k2 { font-size: 11px; color: #C9D6EA; }
.mini .v { font-size: 18px; font-weight: 800; }
.skeleton { height: 14px; border-radius: 7px; background: linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.14), rgba(255,255,255,0.06)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* map */
.areatiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.areatile { border-radius: 18px; padding: 10px 12px; background: rgba(9,22,46,0.5); border: 1px solid rgba(255,255,255,0.16); display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; }
.areatile .nm { font-size: 13px; font-weight: 800; }
.areatile .ct { font-size: 11px; color: #C9D6EA; }
.drops { display: flex; gap: 3px; flex-wrap: wrap; }
.drops i { display: block; width: 12px; height: 12px; border-radius: 6px; box-sizing: border-box; }
.drops i.met { background: #FFFFFF; box-shadow: 0 0 8px rgba(124,196,255,0.9); }
.drops i.reception { background: #FFC46B; box-shadow: 0 0 8px rgba(255,196,107,0.8); }
.drops i.none { border: 2.5px solid #FFFFFF; }
.drops i.partner { outline: 2px solid #7EE8A1; outline-offset: 1px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 11px; font-weight: 600; color: #DDE7F5; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.stop { border-radius: 22px; padding: 12px 14px; display: flex; flex-direction: column; gap: 7px; background: rgba(9,22,46,0.5); border: 1px solid rgba(255,255,255,0.16); }
.stop.off { opacity: 0.55; }
.num { width: 30px; height: 30px; border-radius: 15px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; background: #FFFFFF; color: #0A1F3F; }
.num.hollow { background: transparent; border: 2px solid #FFFFFF; color: #FFFFFF; }

/* revenue */
.revhead { position: sticky; top: 0; z-index: 5; margin: 0 -16px; padding: calc(18px + env(safe-area-inset-top)) 16px 14px; display: flex; flex-direction: column; gap: 10px;
  background: linear-gradient(180deg, rgba(6,22,48,0.96) 0%, rgba(6,22,48,0.86) 78%, rgba(6,22,48,0) 100%); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.big { font-size: 44px; line-height: 52px; font-weight: 800; letter-spacing: -0.03em; }
.bar { display: block; height: 10px; border-radius: 0 5px 5px 0; background: rgba(255,255,255,0.1); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 0 5px 5px 0; background: #3987e5; }
.bar > span.glow { box-shadow: 0 0 10px rgba(57,135,229,0.5); }
.bar.dashed { background: transparent; border: 1.5px dashed rgba(255,213,146,0.6); }
.blocks { display: flex; gap: 4px; flex-wrap: wrap; }
.blocks span { width: 30px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.blocks .approved { background: #3987e5; color: #FFFFFF; }
.blocks .open { border: 1.5px dashed #FFD592; color: #FFD592; }
.blocks .lapsed { background: rgba(255,255,255,0.14); color: #C9D6EA; }
.qtabs button { height: 58px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.16); background: rgba(9,22,46,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.qtabs button[aria-selected="true"] { border-color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.16); box-shadow: 0 0 22px rgba(124,196,255,0.3); }
.qtabs .n { font-size: 18px; font-weight: 800; }
.qtabs .l { font-size: 12px; font-weight: 700; }
.pricechip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 5px 9px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); }
.mchart { position: relative; height: 176px; margin-top: 4px; }
.mgrid { position: absolute; left: 44px; right: 4px; border-top: 1px dashed rgba(255,255,255,0.12); }
.mgrid.base { border-top: 1px solid rgba(255,255,255,0.35); }
.mtick { position: absolute; left: 0; width: 38px; text-align: right; font-size: 10px; line-height: 14px; font-weight: 600; color: #A9BBD6; }
.mbars { position: absolute; left: 50px; right: 6px; top: 0; height: 150px; display: grid; gap: 8px; align-items: end; }
.mbar { height: 150px; border-radius: 14px 14px 0 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
.mbar[aria-pressed="true"] { background: rgba(255,255,255,0.1); }
.mbar .tot { font-size: 12px; line-height: 16px; font-weight: 800; margin-bottom: 2px; }
.mbar .seg2 { display: block; width: min(56px, 70%); margin-top: 2px; flex-shrink: 0; }
.mbar .seg2.top { border-radius: 4px 4px 0 0; }
.mlabels { position: absolute; left: 50px; right: 6px; top: 156px; display: grid; gap: 8px; font-size: 11px; line-height: 16px; font-weight: 700; color: #C9D6EA; text-align: center; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
table.tbl th { text-align: right; color: #C9D6EA; font-weight: 700; padding: 3px 0; }
table.tbl th:first-child, table.tbl td:first-child { text-align: left; }
table.tbl td { text-align: right; padding: 3px 0; }
details > summary { min-height: 40px; display: flex; align-items: center; font-size: 13px; font-weight: 700; color: #A9DAFF; cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.ordernum { font-size: 38px; line-height: 44px; font-weight: 800; letter-spacing: -0.03em; }
.sdot { width: 26px; height: 26px; border-radius: 13px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.sdot.done { background: linear-gradient(135deg, #5AB4FF, #2EE6C9); color: #04203D; }
.sdot.wait { border: 1.5px dashed rgba(255,255,255,0.55); color: #C9D6EA; }
.sdot.open { border: 2px solid #FFD592; color: #FFD592; }
.sdot.warn { background: rgba(255,196,107,0.25); border: 1.5px solid #FFD592; color: #FFE2B0; }
.sdot.alert { background: rgba(255,110,110,0.3); border: 1.5px solid #FFB3B3; color: #FFD3D3; }
.chipdone { background: rgba(126,232,161,0.18); color: #A6F2C0; } .chipwait { background: rgba(255,255,255,0.1); color: #DDE7F5; }

/* sheets */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(3,10,24,0.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  position: relative; width: 100%; max-width: 480px; max-height: calc(100dvh - 40px - env(safe-area-inset-top)); overflow-y: auto; -webkit-overflow-scrolling: touch;
  border-radius: 30px 30px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px;
  background: rgba(12,28,56,0.86); -webkit-backdrop-filter: blur(28px) saturate(170%); backdrop-filter: blur(28px) saturate(170%);
  border-top: 1px solid rgba(255,255,255,0.28); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
}
.grab { width: 40px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.4); align-self: center; flex-shrink: 0; }
.close { width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.legend2 { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #C9D6EA; margin-bottom: 8px; text-transform: uppercase; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.field { width: 100%; border-radius: 16px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #FFFFFF; padding: 10px 12px; font-size: 16px; line-height: 22px; }
textarea.field { resize: vertical; min-height: 72px; }
.field::placeholder { color: #A9BBD6; }
input[type="date"].field { min-height: 44px; color-scheme: dark; }
.preview { border-radius: 16px; padding: 10px 12px; background: rgba(255,255,255,0.07); border: 1px dashed rgba(255,255,255,0.25); font-size: 12px; line-height: 17px; overflow-wrap: anywhere; }
.preview p + p { margin-top: 4px; }
.err { color: #FFB3B3; font-size: 13px; line-height: 18px; font-weight: 600; }
.okfg { color: #A6F2C0; }

/* banner, toast, gate, boot */
.banner { margin: calc(10px + env(safe-area-inset-top)) 16px -4px; border-radius: 16px; padding: 10px 12px; background: rgba(255,110,110,0.2); border: 1px solid rgba(255,179,179,0.5); font-size: 13px; line-height: 18px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.toast { position: fixed; z-index: 60; left: 50%; transform: translate(-50%, 20px); bottom: calc(100px + env(safe-area-inset-bottom)); max-width: min(440px, calc(100% - 32px)); padding: 12px 16px; border-radius: 16px; background: rgba(9,22,46,0.92); border: 1px solid rgba(255,255,255,0.22); box-shadow: 0 12px 30px rgba(0,0,0,0.4); font-size: 14px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.gate { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
.gatecard { width: 100%; max-width: 380px; border-radius: 30px; padding: 26px 22px 22px; display: flex; flex-direction: column; gap: 14px; text-align: center;
  background: rgba(9,22,46,0.55); -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%);
  border: 1px solid rgba(255,255,255,0.2); box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), 0 24px 60px rgba(0,0,0,0.4); }
.gatecard img { height: 44px; width: auto; margin: 0 auto 4px; }
.code { width: 100%; height: 64px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: #FFFFFF; text-align: center; font-size: 30px; font-weight: 800; letter-spacing: 0.4em; padding-left: 0.4em; }
.code.bad { border-color: #FFB3B3; box-shadow: 0 0 0 3px rgba(255,110,110,0.25); }
.boot { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #C9D6EA; font-weight: 600; }
.spin { width: 34px; height: 34px; border-radius: 17px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #5AB4FF; animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin, .skeleton { animation: none; } .toast { transition: none; } }
@media (min-width: 520px) { .screen { padding-left: 20px; padding-right: 20px; } }
</style>
</head>

<main class="gate" id="gate" hidden>
  <form class="gatecard" id="gate-form" autocomplete="off" novalidate>
    <img src="/img/logo-white.svg" alt="DrySafe" width="174" height="55" />
    <div>
      <h1 class="h1 sm">Field CRM</h1>
      <p class="muted" style="margin-top:4px">For the DrySafe team only.</p>
    </div>
    <label for="code" class="small muted">Enter the 6-digit passcode</label>
    <input class="code" id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6"
           autocomplete="one-time-code" placeholder="••••••" aria-describedby="gate-err" />
    <p class="err" id="gate-err" role="alert"></p>
    <button class="btn primary big wide" id="gate-go" type="submit" disabled>Open</button>
    <a class="small dim" href="./classic/">Open the classic dashboard</a>
  </form>
</main>
